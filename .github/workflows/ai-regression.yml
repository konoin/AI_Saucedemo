name: AI Selective Regression

on:
  pull_request:
    branches:
      - main

jobs:
  selective-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Detect changed Playwright tests
        id: changed-tests
        run: |
          git fetch origin main

          node framework/scripts/find-changed-tests.js --base origin/main --head HEAD

          echo "Detected tests:"
          cat changed-tests.txt

          echo "tests<<EOF" >> $GITHUB_OUTPUT
          cat changed-tests.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run changed Playwright tests
        id: playwright
        if: steps.changed-tests.outputs.tests != ''
        continue-on-error: true
        run: |
          xargs -r -a changed-tests.txt npx playwright test > test-output.txt 2>&1

      - name: Prepare lightweight QA summary
        if: always()
        run: |
          node framework/scripts/generate-report.js > email.txt
          cat email.txt

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: >
            AI Regression - ${{ job.status }}

          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: file://email.txt

      - name: Fail workflow if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
