name: AI-Augmented Selective Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run every Playwright test instead of only changed/impacted tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 20
  REGRESSION_ARTIFACT_DIR: regression-artifacts
  PLAYWRIGHT_RETRIES: 1
  PLAYWRIGHT_WORKERS: 2
  EMAIL_CONFIGURED: ${{ secrets.EMAIL_USERNAME != '' && secrets.EMAIL_PASSWORD != '' && secrets.NOTIFICATION_EMAIL != '' }}

jobs:
  selective-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow context
        run: |
          echo "AI-augmented selective regression is active."
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Resolve regression diff range
        id: diff
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE_SHA"
          echo "Diff head: $HEAD_SHA"

      - name: Detect changed and impacted Playwright tests
        id: scope
        env:
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
          FULL_REGRESSION_REQUESTED: ${{ inputs.full_regression || false }}
        run: |
          FULL_FLAG=""
          if [ "$FULL_REGRESSION_REQUESTED" = "true" ]; then
            FULL_FLAG="--full"
          fi

          node framework/scripts/find-changed-tests.js \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output-dir "$REGRESSION_ARTIFACT_DIR" \
            $FULL_FLAG

          SELECTED_COUNT=$(node -e "console.log(require('./${REGRESSION_ARTIFACT_DIR}/regression-scope.json').selectedCount)")
          echo "selected_count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"
          echo "Selected tests: $SELECTED_COUNT"

      - name: Run impacted Playwright tests
        id: playwright
        if: steps.scope.outputs.selected_count != '0'
        run: |
          echo "Running changed and impacted Playwright tests:"
          tr '\n' ' ' < "$REGRESSION_ARTIFACT_DIR/playwright-args.txt"
          echo ""

          set +e
          npx playwright test $(tr '\n' ' ' < "$REGRESSION_ARTIFACT_DIR/playwright-args.txt") \
            --retries="$PLAYWRIGHT_RETRIES" \
            --workers="$PLAYWRIGHT_WORKERS"
          PLAYWRIGHT_EXIT_CODE=$?
          set -e

          echo "$PLAYWRIGHT_EXIT_CODE" > "$REGRESSION_ARTIFACT_DIR/playwright-exit-code.txt"
          echo "Playwright exit code: $PLAYWRIGHT_EXIT_CODE"
          exit 0

      - name: No changed tests detected
        if: steps.scope.outputs.selected_count == '0'
        run: |
          echo "No changed, newly added, impacted, or non-quarantined Playwright tests detected."
          echo "0" > "$REGRESSION_ARTIFACT_DIR/playwright-exit-code.txt"

      - name: Generate intelligent report
        if: always()
        run: |
          node framework/scripts/generate-report.js \
            --results playwright-report/results.json \
            --scope "$REGRESSION_ARTIFACT_DIR/regression-scope.json" \
            --output-dir "$REGRESSION_ARTIFACT_DIR"

      - name: Detect flaky tests
        if: always()
        run: |
          node framework/scripts/flaky-quarantine.js \
            --report "$REGRESSION_ARTIFACT_DIR/regression-report.json" \
            --quarantine framework/regression/flaky-quarantine.json \
            --output-dir "$REGRESSION_ARTIFACT_DIR"

      - name: Publish regression summary
        if: always()
        run: |
          cat "$REGRESSION_ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Read regression summary
        if: always()
        id: regression-summary
        run: |
          {
            echo 'REPORT<<EOF'
            cat "$REGRESSION_ARTIFACT_DIR/summary.md"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Send final regression report
        if: always() && env.EMAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: >
            AI Regression ${{ github.repository }} - ${{ job.status }}

          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: ${{ steps.regression-summary.outputs.REPORT }}

      - name: Skip email notification when secrets are missing
        if: always() && env.EMAIL_CONFIGURED != 'true'
        run: |
          echo "Email notification skipped because EMAIL_USERNAME, EMAIL_PASSWORD, or NOTIFICATION_EMAIL is not configured."

      - name: Upload regression intelligence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-intelligence
          path: regression-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Mark workflow as failed if regression failed
        if: always()
        run: |
          node -e "const report = require('./${REGRESSION_ARTIFACT_DIR}/regression-report.json'); if (report.status === 'FAILED') { console.error('Regression failures detected.'); process.exit(1); }"
