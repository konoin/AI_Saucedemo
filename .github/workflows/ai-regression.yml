name: AI Selective Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  selective-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Detect changed Playwright tests
        id: changed-tests
        run: |
          git fetch origin main

          npm run regression:detect -- origin/main...HEAD

          echo "Detected tests:"
          sed -n '1,120p' changed-tests.txt

          echo "tests<<EOF" >> $GITHUB_OUTPUT
          sed -n '1,120p' changed-tests.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run changed Playwright tests
        id: playwright
        if: steps.changed-tests.outputs.tests != ''
        continue-on-error: true
        run: |
          echo "Running impacted tests:"
          sed -n '1,120p' changed-tests.txt

          mapfile -t CHANGED_TESTS < changed-tests.txt
          npx playwright test --project=chromium "${CHANGED_TESTS[@]}" 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}

      - name: No changed tests
        if: steps.changed-tests.outputs.tests == ''
        run: |
          echo "No Playwright test changes detected."

      - name: Generate lightweight QA summary
        if: always()
        run: npm run regression:report

      - name: Publish lightweight QA summary
        if: always()
        run: |
          if [ -f qa-regression-summary.txt ]; then
            sed -n '1,200p' qa-regression-summary.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Playwright execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: test-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload lightweight QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-qa-summary
          path: |
            qa-regression-summary.txt
            changed-tests.txt
            changed-tests.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail workflow if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
