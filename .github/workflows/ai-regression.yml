name: AI Selective Regression

on:
  pull_request:
    branches:
      - main

jobs:
  selective-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Detect changed Playwright tests
        id: changed-tests
        run: |
          git fetch origin main

          CHANGED_TESTS=$(git diff --name-only origin/main...HEAD | grep -E 'framework/tests/.*\.(spec|test)\.ts$' || true)

          echo "Changed tests:"
          echo "$CHANGED_TESTS"

          echo "tests<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_TESTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run changed Playwright tests
        if: steps.changed-tests.outputs.tests != ''
        run: |
          echo "${{ steps.changed-tests.outputs.tests }}" | xargs npx playwright test

      - name: No changed tests
        if: steps.changed-tests.outputs.tests == ''
        run: |
          echo "No Playwright test changes detected."
