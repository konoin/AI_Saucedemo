name: AI Selective Playwright Regression

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-selective-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selective-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_VERSION: "20"
      CHANGED_TESTS_FILE: changed-tests.txt
      CHANGED_TESTS_JSON_FILE: changed-tests.json
      REGRESSION_EXECUTION_FILE: regression-execution.json
      REGRESSION_SUMMARY_FILE: summary.txt
      REGRESSION_SUMMARY_JSON_FILE: summary.json
      PLAYWRIGHT_JSON_REPORT: playwright-report/results.json
      PLAYWRIGHT_TEST_GLOBS: tests/**/*.spec.ts,tests/**/*.test.ts,framework/tests/**/*.spec.ts,framework/tests/**/*.test.ts
      PLAYWRIGHT_WORKERS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Detect changed Playwright tests
        id: changed-tests
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node framework/scripts/find-changed-tests.js

      - name: Install dependencies
        if: steps.changed-tests.outputs.has_changed_tests == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changed-tests.outputs.has_changed_tests == 'true'
        run: npx playwright install --with-deps

      - name: Run impacted Playwright tests
        if: steps.changed-tests.outputs.has_changed_tests == 'true'
        continue-on-error: true
        run: node framework/scripts/run-impacted-tests.js

      - name: Record skipped execution
        if: steps.changed-tests.outputs.has_changed_tests != 'true'
        run: node framework/scripts/run-impacted-tests.js

      - name: Generate regression report
        id: report
        if: always()
        run: node framework/scripts/generate-report.js

      - name: Read regression summary
        if: always()
        id: regression-summary
        run: |
          {
            echo 'REPORT<<EOF'
            cat summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-selective-regression-report
          path: |
            changed-tests.txt
            changed-tests.json
            regression-execution.json
            summary.txt
            summary.json
            failed-tests.txt
            passed-tests.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Send passed regression notification
        if: always() && steps.report.outputs.outcome != 'failed'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: >
            AI Selective Regression PASSED - ${{ github.repository }}

          to: ${{ secrets.REGRESSION_EMAIL_TO }}
          from: ${{ secrets.REGRESSION_EMAIL_FROM || secrets.SMTP_USERNAME }}

          body: ${{ steps.regression-summary.outputs.REPORT }}

      - name: Send failed regression notification
        if: always() && steps.report.outputs.outcome == 'failed'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: >
            AI Selective Regression FAILED - ${{ github.repository }}

          to: ${{ secrets.REGRESSION_EMAIL_TO }}
          from: ${{ secrets.REGRESSION_EMAIL_FROM || secrets.SMTP_USERNAME }}

          body: ${{ steps.regression-summary.outputs.REPORT }}

      - name: Fail workflow when impacted tests fail
        if: always() && steps.report.outputs.outcome == 'failed'
        run: exit 1
