name: AI Selective Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  selective-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Detect changed Playwright tests
        id: changed-tests
        run: |
          git fetch origin main

          npm run regression:detect -- origin/main...HEAD

          echo "Detected tests:"
          cat changed-tests.txt

          if [ -s changed-tests.txt ]; then
            echo "has-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run changed Playwright tests
        id: playwright
        if: steps.changed-tests.outputs.has-tests == 'true'
        run: |
          echo "Running impacted tests:"
          cat changed-tests.txt

          set +e
          npx playwright test --project=chromium $(tr '\n' ' ' < changed-tests.txt) > test-output.txt 2>&1
          PLAYWRIGHT_EXIT_CODE=$?
          set -e

          echo "$PLAYWRIGHT_EXIT_CODE" > playwright-exit-code.txt

      - name: No changed tests
        if: steps.changed-tests.outputs.has-tests == 'false'
        run: |
          echo "No Playwright test changes detected."
          echo "0" > playwright-exit-code.txt

      - name: Generate lightweight QA summary
        if: always()
        run: npm run regression:report

      - name: Publish lightweight QA summary
        if: always()
        run: cat qa-regression-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lightweight QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-summary
          path: qa-regression-summary.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload Playwright execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: test-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail workflow if tests failed
        if: always()
        run: |
          if [ "$(cat playwright-exit-code.txt)" != "0" ]; then
            exit 1
          fi
