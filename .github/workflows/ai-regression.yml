name: AI-Augmented Selective Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selective-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      REGRESSION_PROJECTS: chromium
      PLAYWRIGHT_RETRIES: "1"
      PLAYWRIGHT_WORKERS: "2"
      FLAKY_QUARANTINE_THRESHOLD: "3"
      PLAYWRIGHT_REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      HAS_EMAIL_CONFIG: ${{ secrets.EMAIL_USERNAME != '' && secrets.EMAIL_PASSWORD != '' && secrets.NOTIFICATION_EMAIL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore flaky history
        uses: actions/cache@v4
        with:
          path: .regression-cache
          key: flaky-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            flaky-history-${{ github.ref_name }}-
            flaky-history-

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Detect changed Playwright tests
        id: changed-tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node framework/scripts/find-changed-tests.js

      - name: Run impacted Playwright tests
        id: playwright
        continue-on-error: true
        run: node framework/scripts/run-selective-regression.js

      - name: Detect flaky tests
        if: always()
        run: node framework/scripts/flaky-quarantine.js

      - name: Generate intelligent report
        if: always()
        run: node framework/scripts/generate-report.js

      - name: Publish report to job summary
        if: always()
        run: cat summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Read regression summary
        if: always()
        id: regression-summary
        run: |
          echo 'report<<EOF' >> "$GITHUB_OUTPUT"
          cat summary.txt >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"

      - name: Send final regression report
        if: always() && env.HAS_EMAIL_CONFIG == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: >
            AI Regression ${{ github.repository }} - ${{ steps.playwright.outcome }}

          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

          body: ${{ steps.regression-summary.outputs.report }}

      - name: Email configuration not present
        if: always() && env.HAS_EMAIL_CONFIG != 'true'
        run: echo "Email notification skipped because EMAIL_USERNAME, EMAIL_PASSWORD, or NOTIFICATION_EMAIL is not configured."

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-regression-artifacts
          path: |
            playwright-report/
            test-results/
            framework/reports/
            changed-tests.txt
            impacted-tests.txt
            runnable-tests.txt
            quarantined-tests.txt
            flaky-tests.txt
            regression-plan.json
            summary.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark workflow as failed if regression failed
        if: always()
        run: node framework/scripts/fail-on-regression.js
