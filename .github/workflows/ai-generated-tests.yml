name: AI Generated Tests

on:
workflow_dispatch:

env:
AI_GENERATED_TEST_DIR: .ai/tasks/generated/auto-tests

jobs:
ai-generated-tests:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - run: npm ci

  - run: npx playwright install --with-deps chromium

  - name: Verify generated tests
    run: |
      if [ ! -d "${{ env.AI_GENERATED_TEST_DIR }}" ]; then
        echo "::error::Directory not found"
        exit 1
      fi

  - name: Run AI generated tests
    run: |
      npx playwright test \
        --config=playwright.ai-generated.config.ts \
        --project=chromium

  - name: Upload HTML Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-report-ai
      path: playwright-report-ai-generated/
      retention-days: 30

  - name: Upload Results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: test-results-ai
      path: test-results-ai-generated/
      retention-days: 30
