name: AI Generated Tests

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  AI_GENERATED_TEST_DIR: .ai/tasks/generated/auto-tests

jobs:
  ai-generated-tests:
    name: Run AI Generated Tests

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'cursor')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display branch info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PR branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR author: ${{ github.event.pull_request.user.login }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify generated tests directory
        run: |
          if [ ! -d "${{ env.AI_GENERATED_TEST_DIR }}" ]; then
            echo "::error::Directory not found: ${{ env.AI_GENERATED_TEST_DIR }}"
            exit 1
          fi

          SPEC_COUNT=$(find "${{ env.AI_GENERATED_TEST_DIR }}" \( -name '*.spec.ts' -o -name '*.test.ts' \) | wc -l | tr -d ' ')

          if [ "$SPEC_COUNT" = "0" ]; then
            echo "::error::No spec files found in ${{ env.AI_GENERATED_TEST_DIR }}"
            exit 1
          fi

          echo "Found $SPEC_COUNT spec file(s)."

      - name: Run AI generated tests
        run: |
          npx playwright test \
            --config=playwright.ai-generated.config.ts \
            --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ai-generated
          path: playwright-report-ai-generated/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ai-generated
          path: test-results-ai-generated/
          retention-days: 30
          if-no-files-found: ignore
