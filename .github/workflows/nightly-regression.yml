name: Nightly Regression

on:
schedule:
  - cron: "0 2 * * *"

workflow_dispatch:

jobs:
regression:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - run: npm ci

  - run: npx playwright install --with-deps

  - name: Run Regression
    run: npm run test:regression

  - name: Upload Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-report-regression
      path: playwright-report/
      retention-days: 30

  - name: Upload Results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: test-results-regression
      path: test-results/
      retention-days: 30
